name: Build ERA Plugin

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Build Plugin DLL
      shell: pwsh
      run: |
        # headers/WoG 폴더만 제외하고 모든 소스 파일을 중복 없이 수집합니다.
        $cppFiles = Get-ChildItem -Path . -Recurse -Filter *.cpp | Where-Object { $_.FullName -notmatch '\\headers\\WoG\\' } | Select-Object -ExpandProperty FullName | Select-Object -Unique
        
        # 데몬의 원본 파일명인 new_battle_interface_dlg.dll로 빌드합니다.
        cl.exe /LD /MT /O2 /EHsc /W3 /D_CRT_SECURE_NO_WARNINGS /Iheaders $cppFiles /Fe:new_battle_interface_dlg.dll /link /DLL user32.lib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: new_battle_interface_plugin
        path: new_battle_interface_dlg.dll