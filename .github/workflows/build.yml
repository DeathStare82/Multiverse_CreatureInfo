- name: Build Plugin DLL
      shell: pwsh
      run: |
        $dllMain = Get-ChildItem -Filter dllmain.cpp | Select-Object -ExpandProperty FullName
        $eraFile = Get-ChildItem -Recurse -Filter era.cpp | Select-Object -ExpandProperty FullName
        $cppFiles = @($dllMain) + @($eraFile) | Select-Object -Unique
        cl.exe /LD /MT /O2 /EHsc /W3 /D_CRT_SECURE_NO_WARNINGS /Iheaders $cppFiles /Fe:Multiverse_CreatureInfo.era /link /DLL user32.lib /ENTRY:_DllMainCRTStartup