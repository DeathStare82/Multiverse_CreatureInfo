name: Build ERA Plugin

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Build Plugin DLL
      shell: pwsh
      run: |
        # 파일 이름 기준(Group-Object)으로 중복 수집을 완전히 방지합니다.
        $cppFiles = Get-ChildItem -Path . -Recurse -Filter *.cpp | Where-Object { $_.FullName -notmatch '\\headers\\WoG\\' } | Group-Object Name | ForEach-Object { $_.Group[0].FullName }
        
        Write-Host "--- Compiling Files ---"
        $cppFiles | ForEach-Object { Write-Host $_ }
        
        # 잘못된 /ENTRY 옵션을 제거하고 필수 윈도우 라이브러리(kernel32.lib, user32.lib)를 함께 링크합니다.
        cl.exe /LD /MT /O2 /EHsc /W3 /D_CRT_SECURE_NO_WARNINGS /Iheaders $cppFiles /Fe:new_battle_interface_dlg.dll /link /DLL kernel32.lib user32.lib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: new_battle_interface_plugin
        path: new_battle_interface_dlg.dll