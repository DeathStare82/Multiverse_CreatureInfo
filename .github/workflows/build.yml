name: Build ERA Plugin

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Build Plugin DLL
      shell: pwsh
      run: |
        # 모든 .cpp 파일을 재귀적으로 검색하여 중복 없이 깔끔하게 수집합니다.
        $cppFiles = Get-ChildItem -Recurse -Filter *.cpp | Select-Object -ExpandProperty FullName | Select-Object -Unique
        
        # 데몬의 원본 플러그인 이름(CreatureInformation.era)으로 출력 파일을 생성합니다.
        cl.exe /LD /MT /O2 /EHsc /W3 /D_CRT_SECURE_NO_WARNINGS /Iheaders $cppFiles /Fe:CreatureInformation.era /link /DLL user32.lib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CreatureInformation_plugin
        path: CreatureInformation.era