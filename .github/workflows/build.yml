name: Build ERA Plugin

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Build Plugin DLL
      shell: pwsh
      run: |
        # headers 폴더를 제외한 모든 경로의 .cpp 파일을 누락 없이 수집합니다.
        $cppFiles = Get-ChildItem -Path . -Recurse -Filter *.cpp | Where-Object { $_.FullName -notmatch '\\headers\\' } | Select-Object -ExpandProperty FullName
        
        # 수집된 파일 목록을 로그에 출력하여 확인합니다.
        Write-Host "--- Compiling Files ---"
        $cppFiles | ForEach-Object { Write-Host $_ }
        
        # CreatureInformation.era 이름으로 컴파일 및 링크를 수행합니다.
        cl.exe /LD /MT /O2 /EHsc /W3 /D_CRT_SECURE_NO_WARNINGS /Iheaders $cppFiles /Fe:CreatureInformation.era /link /DLL user32.lib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CreatureInformation_plugin
        path: CreatureInformation.era