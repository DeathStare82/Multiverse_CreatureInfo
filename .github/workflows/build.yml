name: Build ERA Plugin

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Build Plugin DLL
      shell: pwsh
      run: |
        # headers 폴더를 제외하고 루트 경로의 .cpp 파일들만 명시적으로 수집합니다.
        $cppFiles = Get-ChildItem -Filter *.cpp | Select-Object -ExpandProperty FullName
        
        # 데몬의 원본 플러그인 이름(CreatureInformation.era)으로 정상 빌드합니다.
        cl.exe /LD /MT /O2 /EHsc /W3 /D_CRT_SECURE_NO_WARNINGS /Iheaders $cppFiles /Fe:CreatureInformation.era /link /DLL user32.lib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CreatureInformation_plugin
        path: CreatureInformation.era